[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "kelpie"
version = "0.2.0"
description = "An eD2k engine as fast as eMule, written in Go, with a five-line asyncio interface for Python."
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["kelpie*"]
